# Phase 1: database only. The backend and frontend services are added in Phase 11
# once there is a complete application to containerise.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accesspath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accesspath}
      POSTGRES_DB: ${POSTGRES_DB:-accesspath}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-accesspath} -d $${POSTGRES_DB:-accesspath}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
