version: "3.9"
services:
  m3id-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/m3id.db:/app/backend/m3id.db
    environment:
      - DATABASE_URL=sqlite:///./backend/m3id.db
      - UPLOAD_DIR=backend/uploads
      - SECRET_KEY=change-me-in-production
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  m3id-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - m3id-backend
    restart: unless-stopped
