    </div>
    <div class="sidebar-scroll">
      <div class="nav-section">
        <span class="nav-section-label">Overview</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span><span class="nav-label">Dashboard</span></a>
        <a href="history.html" class="nav-item" data-page="history"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span class="nav-label">Scan History</span></a>
        <a href="alerts.html" class="nav-item" data-page="alerts"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg></span><span class="nav-label">Alerts</span></a>
      </div>
      <div class="nav-section">
        <span class="nav-section-label">Detection</span>
        <a href="fusion.html" class="nav-item" data-page="fusion"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span class="nav-label">Risk Fusion</span></a>
        <a href="face.html" class="nav-item" data-page="face"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 10-16 0"/></svg></span><span class="nav-label">Face Detection</span></a>
        <a href="voice.html" class="nav-item" data-page="voice"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg></span><span class="nav-label">Voice Analysis</span></a>
        <a href="nlp.html" class="nav-item" data-page="nlp"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span><span class="nav-label">Linguistic NLP</span></a>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="user-block" onclick="logout()">
        <div class="user-avatar" data-user-avatar>DS</div>
        <div class="user-info"><div class="user-name" data-user-name>Demo User</div><div class="user-role" data-user-role>Security Researcher</div></div>
        <div class="user-more"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-icon-btn" id="mobile-menu-btn" onclick="openSidebar()" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div><div class="topbar-title">Alerts</div><div class="topbar-sub">Real-time detection notifications</div></div>
    </div>
    <div class="topbar-right">
      <a href="fusion.html" class="topbar-action primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>New Scan</a>
      <div class="theme-switcher"><button class="topbar-icon-btn" id="themeBtn" onclick="toggleThemeMenu('tm-alerts')"><span class="theme-btn-icon" style="display:flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 010 20V2z" fill="currentColor" opacity=".15"/></svg></span></button>
      <div class="theme-menu" id="tm-alerts"><div style="padding:6px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)">Appearance</div><div id="tm-alerts-items"></div></div></div>
    </div>
  </header>
  <main class="main-content"><div class="page-body page-enter">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <select id="sev-filter" onchange="loadAlerts()" style="padding:7px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;outline:none">
        <option value="">All Severities</option>
        <option value="CRITICAL">Critical</option>
        <option value="HIGH">High</option>
        <option value="MEDIUM">Medium</option>
        <option value="LOW">Low</option>
        <option value="CLEAR">Clear</option>
      </select>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <span class="badge badge-info" id="ws-status-badge">Connecting...</span>
        <button class="btn btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <span class="section-title">All Alerts</span>
        <span class="badge badge-danger" id="unread-badge" style="display:none"></span>
      </div>
      <div id="alerts-feed"></div>
    </div>

  </div></main>
</div>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
<script>
(function(){const u=requireAuth("login.html");if(!u)return;setUserUI(u);initMobileSidebar();document.querySelectorAll(".nav-item[data-page]").forEach(function(el){el.classList.toggle("active",el.dataset.page==="alerts");});})();

var DEMO_ALERTS = [
  {id:1,severity:"CRITICAL",title:"Voice Clone Detected",message:"call_recording_04.wav — 97.3% clone probability. Immediate review required.",is_read:false,scan_id:1,created_at:new Date(Date.now()-120000).toISOString()},
  {id:2,severity:"HIGH",title:"Face Deepfake Detected",message:"video_call_ceo.mp4 shows GAN blending artifacts (blending score: 89%).",is_read:false,scan_id:2,created_at:new Date(Date.now()-3600000).toISOString()},
  {id:3,severity:"MEDIUM",title:"Linguistic Anomaly",message:"interview_answers.txt — zero filler words, 5 AI marker phrases. NLP Score: 28%.",is_read:true,scan_id:3,created_at:new Date(Date.now()-7200000).toISOString()},
  {id:4,severity:"CLEAR",title:"Identity Verified",message:"video_meeting_02.mp4 — all 3 modules passed. Fusion score: 91%.",is_read:true,scan_id:4,created_at:new Date(Date.now()-10800000).toISOString()},
  {id:5,severity:"LOW",title:"Minor Signal Detected",message:"phone_call.mp3 — slight voice pitch anomaly. Score: 68%. Monitor recommended.",is_read:true,scan_id:5,created_at:new Date(Date.now()-18000000).toISOString()},
];

var wsConn = null;

function connectWS() {
  var token = getToken();
  if (!token || token.indexOf("demo_") === 0) { updateWSStatus(false); return; }
  try {
    wsConn = new WebSocket("ws://localhost:8000/ws/alerts/" + token);
    wsConn.onopen = function() { updateWSStatus(true); showToast("Live alert stream connected","success",2000); };
    wsConn.onmessage = function(e) { var m=JSON.parse(e.data); if(m.type==="alert"){DEMO_ALERTS.unshift({id:Date.now(),severity:m.severity,title:m.severity+" Alert",message:m.message,is_read:false,created_at:new Date().toISOString()});loadAlerts();} };
    wsConn.onclose = function() { updateWSStatus(false); setTimeout(connectWS,5000); };
  } catch(e) { updateWSStatus(false); }
}

function updateWSStatus(online) {
  var b=document.getElementById("ws-status-badge");
  b.textContent = online ? "Live" : "Offline";
  b.className = "badge " + (online?"badge-success":"badge-warning");
}

function loadAlerts() {
  var sev = document.getElementById("sev-filter").value;
  var alerts = DEMO_ALERTS.filter(function(a){ return !sev || a.severity===sev; });
  var unread = DEMO_ALERTS.filter(function(a){ return !a.is_read; }).length;
  var ub=document.getElementById("unread-badge");
  ub.style.display = unread?"inline-flex":"none";
  ub.textContent = unread + " unread";
  renderAlerts(alerts);
}

function renderAlerts(alerts) {
  var feed=document.getElementById("alerts-feed");
  if (!alerts.length) { feed.innerHTML='<div style="padding:48px;text-align:center;color:var(--text-tertiary)">No alerts found</div>'; return; }
  var icMap = {
    CRITICAL:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    HIGH:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    MEDIUM:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    LOW:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="20 6 9 17 4 12"/></svg>',
    CLEAR:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  };
  var clMap = {CRITICAL:"critical",HIGH:"high",MEDIUM:"medium",LOW:"low",CLEAR:"clear"};
  feed.innerHTML = alerts.map(function(a) {
    return '<div class="alert-item ' + (a.is_read?"":"unread") + '" id="alert-' + a.id + '" onclick="markRead(' + a.id + ')">' +
      '<div class="alert-icon-wrap ' + (clMap[a.severity]||"medium") + '">' + (icMap[a.severity]||icMap.MEDIUM) + '</div>' +
      '<div class="alert-body"><div class="alert-title">' + a.severity + ' — ' + a.title + '</div>' +
      '<div class="alert-desc">' + a.message + '</div>' +
      '<div class="alert-meta"><span class="alert-time">' + timeAgo(a.created_at) + '</span>' +
      (a.scan_id?'<span style="font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono)">Scan #'+a.scan_id+'</span>':'') +
      '</div></div>' +
      (!a.is_read?'<div class="alert-unread-dot"></div>':'') +
      '</div>';
  }).join("");
}

function markRead(id) {
  DEMO_ALERTS = DEMO_ALERTS.map(function(a){ return a.id===id?Object.assign({},a,{is_read:true}):a; });
  loadAlerts();
}

function markAllRead() {
  DEMO_ALERTS = DEMO_ALERTS.map(function(a){ return Object.assign({},a,{is_read:true}); });
  loadAlerts();
  showToast("All alerts marked as read","success");
}

loadAlerts();
connectWS();
</script>
</body>
</html>
